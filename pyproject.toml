[project]
name = "atlas"
version = "0.1.0"
description = "A personal Claude agent: files, web research, shell, and long-term memory in a terminal REPL."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.69",
    "chromadb>=0.5",
    "rich>=13.7",
    "prompt_toolkit>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
atlas = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
